# Template: the image entrypoint replaces ${API_ORIGIN} at container start.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Declared at server level only: an add_header inside a location would
    # drop these for that location.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed file names: safe to cache for a year. A missing asset is a 404,
    # not the SPA shell.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell, which must never be
    # cached so a new build is picked up.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
