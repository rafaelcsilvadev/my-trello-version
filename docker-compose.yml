services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: trello
      POSTGRES_DB: trello
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trello -d trello"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://trello:trello@postgres:5432/trello
      # Dev-only secret: anyone who knows it can forge tokens. Never reuse it
      # in a real deployment.
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 1h
      # Vite dev server and the web container share this host origin.
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      # The alpine image has no curl; Node's global fetch does the probe.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: front-end/Dockerfile
      args:
        # Baked into the bundle: the browser calls the API through the host.
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:8080"

volumes:
  postgres-data:
